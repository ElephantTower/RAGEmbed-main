services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - static-volume:/app/build
    command: sh -c "rm -rf /app/build/* && cp -r /app/dist/* /app/build/ || true"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - static-volume:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  db-init:
    image: curlimages/curl:latest
    container_name: db-init
    volumes:
      - dumps:/dumps
    user: "0:0"
    environment:
      - GITHUB_REPO=${GITHUB_REPO}
      - RELEASE_TAG=${RELEASE_TAG}
      - DUMP_FILENAME=${DUMP_FILENAME}
    command: >
      sh -c "
        echo '=== INIT MODE: Downloading dump ===' &&
        mkdir -p /dumps &&
        chmod 777 /dumps &&
        curl -L -o '$DUMP_PATH' 'https://github.com/$GITHUB_REPO/releases/download/$RELEASE_TAG/$DUMP_FILENAME' &&
        echo 'Dump downloaded:' &&
        ls -lh /dumps/ &&
        du -h /dumps/db_dump.backup
      "
    profiles:
      - init
    restart: "no"

  postgres:
    image: ankane/pgvector:latest
    container_name: postgres_vector
    depends_on:
      db-init:
        condition: service_completed_successfully
        required: false
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DUMP_PATH=${DUMP_PATH}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - dumps:/dumps:ro
      - ./init-scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
      - ./init-ollama.sh:/init-ollama.sh
    entrypoint: /bin/sh
    command: /init-ollama.sh
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: always

volumes:
  static-volume:
  postgres-data:
  ollama_data:
  dumps: